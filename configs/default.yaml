# Default config for the RLM-Paged-Context harness.
# See DESIGN.md for the full spec.

window:
  L: 2048              # active-window cap (middle + tail); prefix is outside L
  tail_max: 1024       # default L // 2 when omitted

store:
  chunk_size: 256
  tier: cpu_dram       # cpu_dram | nvme (deferred)

tools:
  embeddings: false    # enable `s` similarity op (Phase 1.5)
  on_overflow: fail    # fail | auto_evict

harness:
  cost_cap_tokens: 100000
  schemes:
    - paged
    - summarized
    - rag
    - subagent
    - native

logging:
  backend: jsonl
  path: runs/default.jsonl
