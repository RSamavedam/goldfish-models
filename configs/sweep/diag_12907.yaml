# Diagnostic re-run: just Astropy-12907, gpt-5, L=0 (native) + L=2048
# (goldfish window). Used to pinpoint why this task regressed between
# smoke 5 (solved at L=0) and smoke 6 (failed at both L). Smoke 7 ships
# with --turn-log so we can see exactly what the model wrote each turn.

sweep:
  L_values: [2048]
  include_native_baseline: true   # adds L=0 row

providers:
  - openai:gpt-5

benchmarks:
  swe_bench_verified:
    limit: 1                       # SWE-bench loader respects limit; we
    task_ids: ["astropy__astropy-12907"]   # belt-and-suspenders narrow

cost_cap_tokens: 250000
max_turns: 32
command_timeout_s: 60.0
seeds: [0]
