# Phase 1 sweep: bottom-up at the human-working-memory regime.
# Each L value is a separate run; native is a separate baseline line.

sweep:
  L_values: [32, 64, 128, 256, 512, 1024, 2048]
  include_native_baseline: true

providers:
  - openai:gpt-5
  - anthropic:claude-opus-4-7
  - gemini:gemini-2.5-pro

schemes:
  - paged
  - summarized
  - rag
  - subagent

benchmarks:
  long_doc:
    - ruler
    - longbench_v2
  memory_dialogue:
    - locomo
    - memory_agent_bench
  coding:
    - swe_bench_verified
    - repo_qa

cost_cap_tokens: 100000
seeds: [0, 1, 2]
