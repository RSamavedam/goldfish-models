# Phase 1 sweep: TTC reasoning benchmarks at the human-WM regime.
# Each L value is a separate run; native is a separate baseline line.

sweep:
  L_values: [32, 64, 128, 256, 512, 1024, 2048]
  include_native_baseline: true

# Each provider entry can be a bare string (no kwargs) or a mapping with
# `spec` plus optional `kwargs`. Reserved key `thinking_budget_to_L`
# tells the sweep script to set `thinking_budget` equal to the current L
# for that cell (only valid for Anthropic interleaved thinking).
providers:
  # Frontier closed-source APIs.
  - openai:gpt-5
  - anthropic:claude-opus-4-7
  # Same Claude model, but with interleaved thinking + native paging
  # tools. thinking_budget tracks L per cell — see closed_thinking_
  # asymmetry.md for the soft-cap caveat.
  - spec: anthropic:claude-opus-4-7
    kwargs:
      interleaved_thinking: true
      thinking_budget_to_L: true   # set per-cell from sweep L
  - gemini:gemini-2.5-pro
  # Open-weight, hosted on Together (OpenAI-compatible API).
  - together:meta-llama/Llama-3.3-70B-Instruct-Turbo
  - together:meta-llama/Meta-Llama-3.1-405B-Instruct-Turbo
  - together:Qwen/Qwen2.5-72B-Instruct-Turbo
  - together:Qwen/Qwen2.5-Coder-32B-Instruct
  - together:deepseek-ai/DeepSeek-V3
  - together:deepseek-ai/DeepSeek-R1     # visible <think>...</think> -> chunk store

schemes:
  - paged
  - summarized
  - truncated

# Each benchmark gets its own kwargs. The factory in
# rlm_paged.bench.build_suite consumes them.
benchmarks:
  gpqa_diamond:
    limit: 50          # full set is 198; subset for cost control
  math500:
    limit: 100         # full set is 500
  aime_2024:
    limit: 30          # full set
  hle:
    limit: 50          # text-only sample from cais/hle

cost_cap_tokens: 100000
seeds: [0]
