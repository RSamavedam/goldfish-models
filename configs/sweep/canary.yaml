# Canary: validate the bug-15 fix before relaunching the full paper
# sweep. Just astropy-12907 at L=128 + L=2048. ~4 cells total
# (×2 variants).  ~5-15 min wall time, ~$5 total.
#
# Pass criterion: at least one turn produces a non-trivial response
# (out>50 tokens) within the first 5 turns. Old code: 100% out=0.

sweep:
  L_values: [128, 2048]
  include_native_baseline: false

providers:
  - openai:gpt-5

benchmarks:
  swe_bench_verified:
    scorer_mode: subprocess
    scorer_timeout_s: 1800.0
    task_ids:
      - "astropy__astropy-12907"

cost_cap_tokens: 250000
max_turns: 32
command_timeout_s: 60.0
seeds: [0]
