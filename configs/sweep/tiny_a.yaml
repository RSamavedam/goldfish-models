# Tinystate shard A — 5 tasks, just L=2048 (the only L where solves
# are landing). Native baseline L=0 also included as upper bound.
sweep:
  L_values: [2048]
  include_native_baseline: true

providers:
  - openai:gpt-4o

benchmarks:
  swe_bench_verified:
    scorer_mode: subprocess
    scorer_timeout_s: 1800.0
    task_ids:
      - "astropy__astropy-12907"
      - "astropy__astropy-13033"
      - "astropy__astropy-13236"
      - "django__django-13551"
      - "sympy__sympy-13895"

cost_cap_tokens: 250000
max_turns: 20
command_timeout_s: 60.0
seeds: [0]
