model:
  backend: huggingface
  name: Qwen/Qwen2.5-Coder-32B
  max_tokens: 4096

engine:
  budget: 50
  solutions_per_step: 4
  steps_per_update: 1
  eval_interval: 10

buffer:
  max_size: 50000
  selection: puct
  c_puct: 1.5

trainer:
  lr: 1e-5
  optimizer: adamw
  gradient_accumulation: 4
  max_grad_norm: 1.0

beta:
  initial: 1.0
  schedule: adaptive
  min_beta: 0.01

reward:
  name: sorting_net
  timeout_s: 30
  sandbox: subprocess

logging:
  backend: jsonl
  project: ttt-discover
  path: runs/default.jsonl

checkpoint:
  dir: ./checkpoints
  every_n_steps: 10
