[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goldfish-models"
version = "0.1.0"
description = "Language models with goldfish-sized working memory: hard-capped active context, verbatim off-GPU paging, and a token-frugal tool API the model uses to manage its own working memory."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Raghav Samavedam" }]
dependencies = [
    "omegaconf",
    "pyyaml",
    "pydantic",
    "tiktoken",
]

[project.optional-dependencies]
api = [
    "openai>=1.40",
    "anthropic>=0.40",
    "google-genai>=0.7",
    "datasets>=2.20",
]
training = ["torch>=2.2", "transformers", "vllm>=0.4", "wandb"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
goldfish-sweep = "scripts.sweep_phase1:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rlm_paged*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]
